name: Build and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v2.0.0)'
        required: true
        type: string
      draft:
        description: 'Create as draft release'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

# One release run at a time — a re-dispatch for the same version queues instead
# of racing the tag/bump steps.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare_release:
    name: Prepare Release (Bump Version & Tag)
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.create_tag.outputs.tag }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Git Identity
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

      # inputs are passed via env, never interpolated into the script — inline
      # ${{ }} in run blocks is a shell-injection sink.
      - name: Validate Version Input
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION_INPUT" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$VERSION_INPUT' is not a valid version (expected e.g. v2.0.0)"
            exit 1
          fi

      - name: Bump Version & Tag
        id: create_tag
        env:
          VERSION_INPUT: ${{ inputs.version }}
          RELEASE_BRANCH: ${{ github.ref_name }}
        run: |
          VERSION_NUM=${VERSION_INPUT#v}
          TAG="v$VERSION_NUM"

          # Update package.json and package-lock.json
          npm version "$VERSION_NUM" --no-git-tag-version --allow-same-version

          # Commit the bump back to the branch the workflow was dispatched on.
          # Releases are cut from release/* branches — the tag must freeze that
          # branch, never main.
          git add package.json package-lock.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: release $TAG"
            git push origin "HEAD:$RELEASE_BRANCH"
          fi

          # Reuse an existing tag (safe re-run after a failed build), else create it
          if git ls-remote --exit-code --tags origin "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists. Skipping creation and proceeding to build."
          else
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  build_and_release:
    name: Build & Release
    needs: prepare_release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            build_cmd: npm run dist:linux
            artifacts: release/*.AppImage
          - os: windows-latest
            build_cmd: npm run dist:win
            artifacts: release/*.exe

    steps:
      - name: Checkout Tagged Code
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare_release.outputs.release_tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Artifacts
        run: ${{ matrix.build_cmd }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare_release.outputs.release_tag }}
          files: ${{ matrix.artifacts }}
          draft: ${{ inputs.draft }}
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          token: ${{ secrets.GITHUB_TOKEN }}
