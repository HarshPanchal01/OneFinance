name: Bug Report
description: Create a report to help us improve OneFinance
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
        **Security vulnerabilities:** please do not report them here — see [SECURITY.md](https://github.com/HarshPanchal01/OneFinance/blob/main/SECURITY.md) for private reporting.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe the issue...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Feature Area
      description: Where in the app does the bug occur?
      options:
        - Dashboard / widgets
        - Transactions
        - Budgets
        - Savings Goals
        - Schedules / payment reminders
        - Investments (quotes, dividends, FX, alerts)
        - Insights / charts
        - Calculators
        - Auto-categorization rules
        - Security (master password, lock, stay-unlocked)
        - Backups / export / import
        - Settings / localization
        - Command palette / keyboard shortcuts
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating System
      description: e.g. Windows 11, macOS Sequoia, Ubuntu 24.04
      placeholder: Windows 11
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App Version
      description: Shown in Settings → App Info, e.g. 2.0.0
      placeholder: 2.0.0
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add any other context about the problem here (screenshots, logs, etc.).
